name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted runner, Node 26 only (owner rule 2026-10-31).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: helm lint helm/mcp-resource-server --set resourceUri=urn:ci
  forbidden-strings:
    # Fails if a tracked file holds a string from the forbidden-strings list (one per line), an unlisted UUID in docs,
    # or an unlisted private hostname. The list comes from the FORBIDDEN_STRINGS repo secret (docs/forbidden-strings.md).
    # With no secret the script exits 1 under CI=true, so this cannot be skipped. Only counts are printed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -n "$FORBIDDEN_STRINGS" ]; then
            printf '%s\n' "$FORBIDDEN_STRINGS" > "$RUNNER_TEMP/forbidden-strings.txt"
            export FORBIDDEN_STRINGS_FILE="$RUNNER_TEMP/forbidden-strings.txt"
          fi
          npm run check:forbidden
      - name: No AI attribution
        run: bash scripts/check-no-ai-attribution.sh
  gitleaks:
    # Fails the PR if any commit in its history contains a secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_8.30.1_checksums.txt"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xz -f gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner -v


  postman:
    # The Postman collection against the lab's own server: boots on a spare
    # port, runs newman with the committed placeholder environment, fails on
    # any assertion. Regenerate with shared/postman/generator.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out the family shared directory
        uses: actions/checkout@v5
        with:
          repository: curtismu7/AI-DEMO-Standalone
          ref: main
          path: family
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run build
      - run: bash family/shared/postman/ci-check.sh mcp-resource-server-lab /api/health node --experimental-sqlite dist/index.js
